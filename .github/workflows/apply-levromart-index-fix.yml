name: Apply Levromart index repair

on:
  push:
    paths:
      - '.github/levromart-index.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check .github/levromart-index.patch
          git apply .github/levromart-index.patch
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Levromart vendor, roles, media and discovery flows' || exit 0
          git push origin main
      - name: Remove patch and workflow
        if: always()
        run: |
          git checkout main
          git rm -f .github/levromart-index.patch .github/workflows/apply-levromart-index-fix.yml || true
          git commit -m 'Remove one-time Levromart repair workflow' || exit 0
          git push origin main || true
