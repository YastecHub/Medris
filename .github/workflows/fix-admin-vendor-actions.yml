name: Fix admin vendor actions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        run: python3 scripts/patch_admin_vendor_actions.py

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if not block.strip():
                  continue
              f = Path(f'/tmp/levromart-script-{i}.js')
              f.write_text(block, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(r.returncode)
          print('JavaScript syntax OK:', len(blocks), 'script blocks')
          PY

      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile admin vendor action buttons [skip ci]'
          git push origin main
