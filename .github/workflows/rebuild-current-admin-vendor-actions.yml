name: Rebuild current admin vendor actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-current-admin-vendor-actions.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove competing vendor action implementations and install one controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The current index contains multiple later overrides of the canonical
          # setVendorStatus function. Remove only the later override blocks,
          # keeping the first canonical implementation intact.
          pat1 = re.compile(
              r'\n\s*/\* ---------------------------------------------------------------\n'
              r'\s*ADMIN VENDOR APPROVAL — make the operation verifiable and prevent a\n'
              r'\s*silent no-op\..*?\n\s*\};\n\n\s*/\* ---------------------------------------------------------------\n'
              r'\s*VENDOR APPLICATION', re.S)
          s, n1 = pat1.subn(
              '\n\n  /* ---------------------------------------------------------------\n     VENDOR APPLICATION', s, count=1)
          if n1 != 1:
              raise SystemExit(f'Expected one later vendorStatusBusy override, found {n1}')

          pat2 = re.compile(
              r'\n\s*/\* ---------------------------------------------------------------\n'
              r'\s*APPROVAL: verified \+ active in ONE vendor update\..*?\n\s*\};\n\n\s*/\* ---------------------------------------------------------------\n'
              r'\s*APPROVED VENDOR SESSION AUTO-LOCATION', re.S)
          s, n2 = pat2.subn(
              '\n\n  /* ---------------------------------------------------------------\n     APPROVED VENDOR SESSION AUTO-LOCATION', s, count=1)
          if n2 != 1:
              raise SystemExit(f'Expected one later approvalBusy override, found {n2}')

          # Remove the old document capture listener. The new controller below
          # becomes the only event path for admin vendor buttons.
          s, n3 = re.subn(
              r'\s*<script id="levromart-admin-action-delegation-fix">.*?</script>\s*',
              '\n', s, count=1, flags=re.S)
          if n3 != 1:
              raise SystemExit(f'Expected old delegation listener, found {n3}')

          # Export the canonical functions explicitly and install one capture
          # listener that works with dynamically rendered vendor rows.
          controller = r'''<script id="levromart-admin-vendor-actions-final">
          (function(){
            "use strict";
            if(window.__levromartAdminVendorActionsFinal) return;
            window.__levromartAdminVendorActionsFinal = true;

            // Explicit exports remove any ambiguity about which function the
            // rendered buttons call after navigation/re-rendering.
            if(typeof setVendorStatus === "function") window.setVendorStatus = setVendorStatus;
            if(typeof adminDeleteVendor === "function") window.adminDeleteVendor = adminDeleteVendor;

            const selector = "#adminPanel .vendor-admin-action";
            let inFlight = false;

            function setBusy(btn, busy){
              if(!btn) return;
              if(busy){
                btn.dataset.adminBusy = "1";
                btn.dataset.originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.setAttribute("aria-busy", "true");
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Working…';
              } else {
                if(btn.dataset.originalHtml != null && btn.isConnected) btn.innerHTML = btn.dataset.originalHtml;
                btn.disabled = false;
                btn.removeAttribute("aria-busy");
                delete btn.dataset.adminBusy;
                delete btn.dataset.originalHtml;
              }
            }

            async function run(btn, event){
              if(!btn || inFlight || btn.dataset.adminBusy === "1") return;

              const id = String(btn.dataset.vendorId || "").trim();
              const status = String(btn.dataset.status || "").trim();
              const filter = ["all","pending","verified","rejected"].includes(btn.dataset.filterStatus)
                ? btn.dataset.filterStatus : "pending";

              if(!id || !["verified","rejected","delete"].includes(status)){
                event.preventDefault();
                event.stopImmediatePropagation();
                if(typeof showToast === "function") showToast("This vendor action is invalid. Refresh the page and try again.", "error");
                return;
              }

              event.preventDefault();
              event.stopImmediatePropagation();
              inFlight = true;
              setBusy(btn, true);

              try {
                if(status === "delete") {
                  if(typeof window.adminDeleteVendor !== "function") throw new Error("Vendor delete handler is unavailable.");
                  await window.adminDeleteVendor(id, filter);
                } else {
                  if(typeof window.setVendorStatus !== "function") throw new Error("Vendor status handler is unavailable.");
                  await window.setVendorStatus(id, status, filter);
                }
              } catch(err) {
                console.error("[Levromart] Vendor admin action failed:", err);
                if(typeof showToast === "function") showToast(`Could not complete this action: ${err?.message || String(err)}`, "error");
              } finally {
                inFlight = false;
                if(btn.isConnected) setBusy(btn, false);
              }
            }

            document.addEventListener("click", function(event){
              const btn = event.target?.closest?.(selector);
              if(btn) run(btn, event);
            }, true);

            document.addEventListener("keydown", function(event){
              if(event.key !== "Enter" && event.key !== " ") return;
              const btn = event.target?.closest?.(selector);
              if(!btn) return;
              run(btn, event);
            }, true);
          })();
          </script>
          <style id="levromart-admin-vendor-actions-final-style">
          #adminPanel .vendor-admin-action{
            pointer-events:auto!important;
            touch-action:manipulation!important;
            -webkit-tap-highlight-color:transparent;
            position:relative;
            z-index:2;
          }
          #adminPanel .vendor-admin-action:disabled{opacity:.72;cursor:wait}
          </style>
          '''

          idx = s.rfind('</body>')
          if idx < 0: raise SystemExit('Final </body> tag not found')
          s = s[:idx] + controller + '\n' + s[idx:]

          checks = {
            'canonical_setVendorStatus_defs': len(re.findall(r'async function setVendorStatus\(', s)),
            'canonical_adminDeleteVendor_defs': len(re.findall(r'async function adminDeleteVendor\(', s)),
            'vendorStatusBusy_overrides': len(re.findall(r'window\.setVendorStatus\s*=\s*async function', s)),
            'approvalBusy_overrides': len(re.findall(r'let approvalBusy\s*=', s)),
            'old_listener': len(re.findall(r'id="levromart-admin-action-delegation-fix"', s)),
            'final_controller': len(re.findall(r'id="levromart-admin-vendor-actions-final"', s)),
          }
          expected = {
            'canonical_setVendorStatus_defs': 1,
            'canonical_adminDeleteVendor_defs': 1,
            'vendorStatusBusy_overrides': 0,
            'approvalBusy_overrides': 0,
            'old_listener': 0,
            'final_controller': 1,
          }
          if checks != expected:
              raise SystemExit(f'Admin vendor rebuild assertions failed: {checks}')

          p.write_text(s, encoding='utf-8')
          print('ADMIN VENDOR REBUILD OK', checks)
          PY

      - name: Validate all JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if not block.strip(): continue
              f = Path(f'/tmp/levromart-script-{i}.js')
              f.write_text(block, encoding='utf-8')
              r = subprocess.run(['node','--check',str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(r.returncode)
          print('JavaScript syntax OK:', len(blocks), 'script blocks')
          PY

      - name: Commit rebuilt current index and remove this workflow
        run: |
          rm -f .github/workflows/rebuild-current-admin-vendor-actions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/rebuild-current-admin-vendor-actions.yml
          git commit -m 'Rebuild current admin vendor actions [skip ci]'
          git push origin main
