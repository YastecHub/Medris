# Local PostgreSQL for development and tests (never used in production).
#   docker compose up -d db
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/medris_dev
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/medris_test
# Supabase runs PostgreSQL 17; use the same major version locally.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medris_dev
    ports:
      - "5432:5432"
    volumes:
      - medris-db:/var/lib/postgresql/data
      - ./medris-backend/scripts/docker-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  medris-db:
