<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Local aid, not used by CI: hides a system-installed Inter so screenshots match the CI machine, which has none
     (the tests serve their own Inter, see fixtures/fonts). Use: FONTCONFIG_FILE=$PWD/tests/e2e/support/no-system-inter.conf npm run test:e2e -w medris-frontend -->
<fontconfig><dir>/usr/share/fonts/truetype</dir><selectfont><rejectfont><glob>/usr/share/fonts/opentype/inter/*</glob></rejectfont></selectfont><cachedir prefix="xdg">levromart-e2e-fontconfig</cachedir></fontconfig>
